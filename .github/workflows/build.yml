name: Run tests

on:
  pull_request:
    paths: &paths
      - 'src/**'
      - 'tests/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - '.github/workflows/build.yml'
  push:
    branches: ['master']
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: make build v="${PHP_VERSION}"
        env:
          PHP_VERSION: ${{ matrix.php }}

      - name: Run tests with phpunit
        run: make test v="${PHP_VERSION}"
        env:
          PHP_VERSION: ${{ matrix.php }}
